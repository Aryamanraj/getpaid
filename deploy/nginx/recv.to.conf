# /etc/nginx/sites-available/recv.to
#
# Cloudflare Full (Strict) origin setup — host nginx instead of Caddy.
# 1. Generate a Cloudflare Origin Certificate for `recv.to, *.recv.to`
# 2. Save cert to /etc/ssl/cloudflare/recv.to.pem
# 3. Save key  to /etc/ssl/cloudflare/recv.to.key
# 4. Enable Full (Strict) in Cloudflare SSL/TLS settings
#
# Setup:
#   sudo ln -s /etc/nginx/sites-available/recv.to /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The stack runs in Docker behind this (see deploy/docker-compose.nginx.yml):
#   web (Next)  127.0.0.1:3000   api (Nest)  127.0.0.1:3001
#
# `Host $host` is load-bearing: username subdomains, multi-domain branding,
# and CORS all key off the Host header. Never drop it.

server {
    listen 80;
    listen [::]:80;
    server_name recv.to *.recv.to;
    return 301 https://$host$request_uri;
}

# api.recv.to → NestJS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.recv.to;

    ssl_certificate     /etc/ssl/cloudflare/recv.to.pem;
    ssl_certificate_key /etc/ssl/cloudflare/recv.to.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/api.recv.to.access.log;
    error_log  /var/log/nginx/api.recv.to.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# recv.to + every username subdomain → Next
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recv.to *.recv.to;

    ssl_certificate     /etc/ssl/cloudflare/recv.to.pem;
    ssl_certificate_key /etc/ssl/cloudflare/recv.to.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/recv.to.access.log;
    error_log  /var/log/nginx/recv.to.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Next's hashed build assets are content-addressed — cache hard
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

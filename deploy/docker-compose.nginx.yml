# Override for running behind host nginx instead of the bundled Caddy.
# Binds web/api to loopback for nginx to proxy; start only web api redis so
# the caddy service never comes up:
#
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.nginx.yml \
#     --env-file deploy/.env.prod up -d --build web api redis
#
# nginx site configs live in deploy/nginx/. ACME_EMAIL and CLOUDFLARE_API_TOKEN
# in deploy/.env.prod are Caddy-only and can stay blank.

services:
  web:
    ports:
      # host 3274 → container 3000: 3000 is taken by another app on the server
      - '127.0.0.1:3274:3000'
  api:
    ports:
      - '127.0.0.1:3001:3001'

# Dual-stack network so containers can reach IPv6-only endpoints — Supabase's
# direct connection host has no A record on the free tier. ULA subnet; Docker
# 27+ NATs it out through the host's IPv6 (ip6tables is on by default).
# Requires working IPv6 on the host: `curl -6 ifconfig.co` must answer.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:5ca1:e3ef::/64

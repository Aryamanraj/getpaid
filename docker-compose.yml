services:
  redis:
    image: redis:7-alpine
    container_name: recv-redis
    restart: unless-stopped
    # Bound to loopback only — Redis holds cache, rate-limit counters and
    # verification jobs, none of which should be reachable from outside.
    ports:
      - '127.0.0.1:6379:6379'
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Local development only. Production uses Supabase — see README.
  postgres:
    image: postgres:16-alpine
    container_name: recv-postgres
    profiles: ['dev']
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: recv
      POSTGRES_PASSWORD: recv
      POSTGRES_DB: recv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recv -d recv']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:

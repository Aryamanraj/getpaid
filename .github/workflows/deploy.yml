# Push to main → lint/typecheck/test → SSH to the server → deploy/deploy.sh.
#
# First-time server setup is manual (clone, secrets, nginx — docs/DEPLOY.md);
# after that this workflow owns updates. Repository secrets required:
#
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      ssh user (must be in the docker group)
#   DEPLOY_SSH_KEY   private key for that user (ed25519, no passphrase)
#   DEPLOY_PATH      absolute path of the clone, e.g. /opt/getpaid
#   DEPLOY_PORT     (optional) ssh port, defaults to 22

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn biome:ci
      - run: yarn shared build
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: yarn api test

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh

# Push to main → checks and image builds run in parallel → SSH to the server,
# which pulls the prebuilt images and swaps (deploy/deploy.sh). The server
# never compiles anything.
#
# First-time server setup is manual (clone, secrets, nginx — docs/DEPLOY.md);
# after that this workflow owns updates. Repository secrets required:
#
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      ssh user (must be in the docker group)
#   DEPLOY_SSH_KEY   private key for that user (ed25519, no passphrase)
#   DEPLOY_PATH      absolute path of the clone, e.g. /opt/getpaid
#   DEPLOY_PORT     (optional) ssh port, defaults to 22
#
# Images live in GHCR (ghcr.io/aryamanraj/getpaid-{web,api}) and must be
# PUBLIC packages so the server can pull anonymously — one-time visibility
# flip after the first push.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn biome:ci
      - run: yarn shared build
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: yarn api test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/aryamanraj/getpaid-api:latest
            ghcr.io/aryamanraj/getpaid-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.payee.id/api/v1' }}
          tags: |
            ghcr.io/aryamanraj/getpaid-web:latest
            ghcr.io/aryamanraj/getpaid-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
